# Thermostat panel: a Waveshare ESP32-S3-Touch-LCD-4.3 in portrait, controlling a Pioneer WYT mini-split (this
# repository's component) through Home Assistant.
#
# The screen is ui.yaml, shared with the Mac preview (mock.yaml). Set the substitutions below to your mini-split's
# entities as Home Assistant names them (Settings > Devices > your mini-split).
# Home Assistant side: once the panel is added, turn on "Allow the device to perform Home Assistant actions" in its
# ESPHome device options, or the buttons change nothing.
#
# The setpoint moves one whole F at a time (61-89): the mini-split runs in its own Fahrenheit mode.

substitutions:
  name: thermostat-panel
  friendly_name: Thermostat Panel
  climate_entity: climate.my_mini_split
  indoor_entity: sensor.my_mini_split_indoor_temperature
  outdoor_entity: sensor.my_mini_split_outdoor_temperature
  power_entity: sensor.my_mini_split_power
  fault_entity: sensor.my_mini_split_fault
  # Only with the garage-safety branch on the mini-split: the garage door, and the mini-split's device name as in
  # sensor.<name>_door_pause_state. Without it these entities do not exist and the door screens never appear.
  door_entity: cover.garage_door
  safety_device: my_mini_split
  eco_entity: switch.my_mini_split_eco
  sleep_entity: switch.my_mini_split_sleep
  swing_v_entity: switch.my_mini_split_up_down_louver
  swing_h_entity: switch.my_mini_split_left_right_louver
  display_entity: switch.my_mini_split_display
  # 90 or 270: which way up the panel hangs.
  screen_rotation: "270"
  # The name at the top of the screen.
  room_name: Garage

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Waveshare ESP32-S3-Touch-LCD-4.3 thermostat for a Pioneer WYT mini-split
  on_boot:
    priority: -100
    then:
      - script.execute: ui_theme

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Logs why the panel last restarted (in the boot log).
debug:

api:
  encryption:
    key: !secret panel_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The radio stays fully awake. ESP32's default, light power save, sleeps between beacons, so replies took
  # 200-600 ms. The screen's sleep never touches Wi-Fi.
  power_save_mode: none
  # No hops between access points: each hop drops the link, and a failed one can leave the panel offline for half a
  # minute. The panel joins the strongest access point when it starts.
  post_connect_roaming: false
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret panel_ap_password

captive_portal:

packages:
  ui: !include
    file: ui.yaml
    vars:
      mdi_font: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf

globals:
  # The climate entity reads unavailable or unknown while the mini-split is offline.
  - id: g_unit_online
    type: bool
    initial_value: "false"

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9

ch422g:
  - id: io_ex
    i2c_id: bus_a

# EXIO2 is the backlight enable (on or off only; no dimming on this board).
switch:
  # Screen saver on or off; off wakes a dark screen and keeps it lit.
  - platform: template
    id: screen_saver
    name: "Screen saver"
    icon: mdi:monitor-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - script.execute: screen_wake
  # The screen itself, for Home Assistant: on wakes it (counting as a touch, so the screen saver starts over), off
  # darkens it as the screen saver does.
  - platform: template
    id: screen
    name: "Screen"
    icon: mdi:monitor
    # Only reports the backlight at boot; a restore mode would run its on or off action.
    restore_mode: DISABLED
    lambda: "return id(backlight).state;"
    turn_on_action:
      - script.execute: screen_wake
    turn_off_action:
      - script.execute: screen_sleep
  - platform: gpio
    id: backlight
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true

number:
  - platform: template
    id: screen_saver_minutes
    name: "Screen saver timeout"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: disp
    update_interval: never
    auto_clear_enabled: false
    enable_pin:
      - ch422g: io_ex
        number: 2
        allow_other_uses: true

touchscreen:
  - platform: gt911
    id: touch
    display: disp
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_ex
      number: 1
    # A tap on the dark screen only wakes it: LVGL is paused, so the tap reaches no button.
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - script.execute: screen_wake

lvgl:
  rotation: ${screen_rotation}
  # The screen saver (both settable in Home Assistant): the screen goes dark after the timeout without a touch.
  on_idle:
    # Until the saved timeout loads at boot the number has no value: 15 minutes, never 0 (a dark screen at boot).
    timeout: !lambda |-
      const float minutes = id(screen_saver_minutes).state;
      return (uint32_t) ((std::isnan(minutes) || minutes < 1.0f ? 15.0f : minutes) * 60000.0f);
    then:
      - if:
          condition:
            switch.is_on: screen_saver
          then:
            - script.execute: screen_sleep

# Home Assistant -> screen
time:
  - platform: homeassistant
    id: ha_time

text_sensor:
  # The mini-split's garage safety: what it is doing, what comes back when the door closes, and its last action.
  - platform: homeassistant
    id: ha_dp_state
    entity_id: sensor.${safety_device}_door_pause_state
    on_value:
      - lambda: |-
          int dp = 0;
          if (x == "Door open") dp = 1;
          else if (x == "Paused" || x == "Door closed") dp = 2;
          else if (x == "Heating for safety") dp = 3;
          else if (x == "Cooling for safety") dp = 4;
          else if (x == "Waiting for the door to close") dp = 5;
          const int was = id(g_dp);
          id(g_dp) = dp;
          if (dp < 2 || dp > 4) id(g_dp_view) = false;
          // A pause or a safety mode starting lights the screen, so it is seen.
          if (dp >= 2 && dp <= 4 && dp != was) {
            id(g_dp_view) = false;
            id(screen_wake).execute();
          }
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_dp_saved
    entity_id: sensor.${safety_device}_door_pause_saved
    on_value:
      - lambda: |-
          // "heat 69": the climate mode and setpoint (F) that come back when the door closes.
          const size_t sp = x.find(' ');
          if (sp == std::string::npos) return;
          const std::string m = x.substr(0, sp);
          int mode = -1;
          if (m == "heat") mode = 1;
          else if (m == "cool") mode = 2;
          else if (m == "heat_cool" || m == "auto") mode = 3;
          else if (m == "dry") mode = 4;
          else if (m == "fan_only") mode = 5;
          if (mode < 0) return;
          id(g_saved_mode) = mode;
          id(g_saved_sp) = atoi(x.c_str() + sp + 1);
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_dp_last
    entity_id: sensor.${safety_device}_door_pause_last_action
    on_value:
      - lambda: |-
          // A new guard action (not the one already there at start-up, nor a repeat on reconnecting) leaves a card.
          static bool first = true;
          static std::string last;
          if (first) { first = false; last = x; return; }
          if (x == last) return;
          last = x;
          if (x.rfind("Guard:", 0) != 0) return;
          id(g_guard_note) = x.find("below") != std::string::npos ? 1 : 2;
          id(g_guard_temp) = id(g_indoor);
          std::string t = id(ha_time).now().is_valid() ? id(ha_time).now().strftime("%I:%M %p") : "";
          if (!t.empty() && t[0] == '0') t.erase(0, 1);
          for (auto &ch : t) ch = tolower(ch);
          id(g_guard_time) = t;
          id(screen_wake).execute();
      - script.execute: ui_refresh
  # Whether the outdoor unit is running, and for what.
  - platform: homeassistant
    id: ha_action
    entity_id: ${climate_entity}
    attribute: hvac_action
    on_value:
      - lambda: |-
          id(g_action) = x == "heating" ? 1 : x == "cooling" ? 2 : x == "drying" ? 3 : 0;
      - script.execute: ui_refresh
  # "None", or "Fault bits: 3 5": the numbers go on the screen.
  - platform: homeassistant
    id: ha_fault
    entity_id: ${fault_entity}
    on_value:
      - lambda: |-
          static const std::string PREFIX = "Fault bits:";
          std::string f;
          if (x.rfind(PREFIX, 0) == 0) {
            f = x.substr(PREFIX.size());
            const size_t start = f.find_first_not_of(' ');
            f = start == std::string::npos ? "" : f.substr(start);
          }
          id(g_fault) = f;
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_mode
    entity_id: ${climate_entity}
    on_value:
      - lambda: |-
          static const char *const NAMES[6] = {"off", "heat", "cool", "heat_cool", "dry", "fan_only"};
          id(g_unit_online) = false;
          for (int i = 0; i < 6; i++) {
            if (x == NAMES[i]) {
              id(g_mode) = i;
              id(g_unit_online) = true;
              break;
            }
          }
      - script.execute: link_check
  - platform: homeassistant
    id: ha_fan
    entity_id: ${climate_entity}
    attribute: fan_mode
    on_value:
      - lambda: |-
          static const char *const NAMES[8] = {"auto", "Mute", "low", "Low-Mid", "medium", "Mid-High", "high", "Turbo"};
          for (int i = 0; i < 8; i++) {
            if (x == NAMES[i]) {
              id(g_fan) = i;
              break;
            }
          }
      - script.execute: ui_refresh

sensor:
  # Minutes until the door pause acts (unknown while none is coming), and the door's open percentage.
  - platform: homeassistant
    id: ha_dp_left
    entity_id: sensor.${safety_device}_door_pause_in
    on_value:
      - lambda: "id(g_dp_left) = std::isnan(x) ? -1 : (int) x;"
      - script.execute: ui_refresh
  # Minutes until the saved settings come back once the door has closed after a pause (unknown otherwise).
  - platform: homeassistant
    id: ha_dp_resume
    entity_id: sensor.${safety_device}_door_pause_resumes_in
    on_value:
      - lambda: "id(g_dp_resume) = std::isnan(x) ? -1 : (int) x;"
      - script.execute: ui_refresh
  # How long the door must stay closed before the saved settings come back (the mini-split's setting).
  - platform: homeassistant
    id: ha_dp_wait
    entity_id: number.${safety_device}_door_pause_resume_wait
    on_value:
      - lambda: "id(g_dp_wait) = std::isnan(x) ? -1 : (int) lroundf(x);"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_door_pct
    entity_id: ${door_entity}
    attribute: current_position
    on_value:
      - lambda: "id(g_door_pct) = std::isnan(x) ? -1 : (int) lroundf(x);"
      - script.execute: ui_refresh
  # The safety limits (F), for the paused and safety screens.
  - platform: homeassistant
    id: ha_dp_low
    entity_id: number.${safety_device}_safety_low_limit
    on_value:
      - lambda: "if (!std::isnan(x)) id(g_dp_low) = (int) lroundf(x);"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_dp_high
    entity_id: number.${safety_device}_safety_high_limit
    on_value:
      - lambda: "if (!std::isnan(x)) id(g_dp_high) = (int) lroundf(x);"
      - script.execute: ui_refresh
  - platform: wifi_signal
    name: "Wi-Fi signal"
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: homeassistant
    id: ha_setpoint
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      - script.execute: setpoint_from_ha
  - platform: homeassistant
    id: ha_indoor
    entity_id: ${indoor_entity}
    on_value:
      - lambda: "id(g_indoor) = x;"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_outdoor
    entity_id: ${outdoor_entity}
    on_value:
      - lambda: "id(g_outdoor) = x;"
      - script.execute: ui_refresh
  # The mini-split's own power reading (W); unavailable reads NaN, shown as "-- W".
  - platform: homeassistant
    id: ha_power
    entity_id: ${power_entity}
    on_value:
      - lambda: "id(g_power) = x;"
      - script.execute: ui_refresh

binary_sensor:
  - platform: homeassistant
    id: ha_eco
    entity_id: ${eco_entity}
    on_state:
      - lambda: "id(g_eco) = x;"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_sleep
    entity_id: ${sleep_entity}
    on_state:
      - lambda: "id(g_sleep) = x;"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_swing_v
    entity_id: ${swing_v_entity}
    on_state:
      - lambda: "id(g_swing_v) = x;"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_swing_h
    entity_id: ${swing_h_entity}
    on_state:
      - lambda: "id(g_swing_h) = x;"
      - script.execute: ui_refresh
  - platform: homeassistant
    id: ha_display
    entity_id: ${display_entity}
    on_state:
      - lambda: "id(g_display) = x;"
      - script.execute: ui_refresh

interval:
  - interval: 2s
    then:
      - script.execute: link_check

script:
  # "Not connected" unless Home Assistant is subscribed to this panel and the mini-split is online.
  - id: link_check
    then:
      - lambda: |-
          const bool linked = api::global_api_server->is_connected_with_state_subscription() && id(g_unit_online);
          if (linked != id(g_connected)) {
            id(g_connected) = linked;
          }
      - script.execute: ui_refresh

  # Takes Home Assistant's setpoint (F) unless it is being changed here.
  - id: setpoint_from_ha
    then:
      - lambda: |-
          const float f = id(ha_setpoint).state;
          if (std::isnan(f)) return;
          if ((int32_t) (id(g_sp_hold) - millis()) > 0) return;
          int v = (int) lroundf(f);
          if (v < ${sp_min}) v = ${sp_min};
          if (v > ${sp_max}) v = ${sp_max};
          id(g_sp) = v;
      - script.execute: ui_refresh

  # Screen -> Home Assistant
  - id: send_mode
    parameters:
      m: int
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${climate_entity}
            hvac_mode: !lambda |-
              static const char *const NAMES[6] = {"off", "heat", "cool", "heat_cool", "dry", "fan_only"};
              return std::string(NAMES[(m < 0 || m > 5) ? 0 : m]);

  - id: send_fan
    parameters:
      f: int
    then:
      - homeassistant.action:
          action: climate.set_fan_mode
          data:
            entity_id: ${climate_entity}
            fan_mode: !lambda |-
              static const char *const NAMES[8] = {"auto", "Mute", "low", "Low-Mid", "medium", "Mid-High", "high", "Turbo"};
              return std::string(NAMES[(f < 0 || f > 7) ? 0 : f]);

  # Waits for taps to stop, sends once (whole F), then takes Home Assistant's value again.
  - id: send_setpoint
    mode: restart
    then:
      - delay: 700ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda |-
              return to_string(id(g_sp));
      - delay: 4s
      - lambda: "id(g_sp_hold) = millis();"
      - script.execute: setpoint_from_ha

  - id: send_toggle
    parameters:
      idx: int
      turn_on: bool
    then:
      - homeassistant.action:
          action: !lambda 'return turn_on ? std::string("switch.turn_on") : std::string("switch.turn_off");'
          data:
            entity_id: !lambda |-
              static const char *const ENTITIES[5] = {"${eco_entity}", "${sleep_entity}", "${swing_v_entity}",
                                                       "${swing_h_entity}", "${display_entity}"};
              return std::string(ENTITIES[(idx < 0 || idx > 4) ? 0 : idx]);

  # Lights the screen and counts it as a touch, so the screen saver's timeout starts over.
  - id: screen_wake
    then:
      - lambda: "lv_display_trigger_activity(nullptr);"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - switch.turn_on: backlight

  # Darkens the screen.
  - id: screen_sleep
    then:
      # The next look at a paused screen starts on the full paused screen again.
      - lambda: "id(g_dp_view) = false;"
      - script.execute: ui_refresh
      - switch.turn_off: backlight
      - lvgl.pause:
